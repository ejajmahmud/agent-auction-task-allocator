[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-auction-task-allocator"
version = "0.1.0"
description = "Double-auction and sealed-bid task market matching agent execution requests with specialized agent workers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-auction-task-allocator = "agent_auction_task_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_auction_task_allocator*"]
